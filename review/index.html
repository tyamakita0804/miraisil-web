<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>運勢の振り返り | 今日の運勢 AIミライ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon-32x32.png">
<link rel="stylesheet" href="/liff-theme/ivory-gold.css">
<!-- 「トークに戻る」でページを閉じる（liff.closeWindow は liff.init の前でも使える：LIFF SDK v2.4.0 以降） -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* 運勢の振り返り（2026-11-19）。色は /liff-theme/ivory-gold.css（大切な日の画面と共通・2026-11-23）。ここに色の値を書かない。 */
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
       font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:18px;line-height:1.7;min-height:100vh}
  button,textarea{font-family:inherit;font-size:inherit;color:inherit}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}

  .head{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
  .head img{width:52px;height:52px;border-radius:50%;box-shadow:0 3px 12px rgba(90,70,30,.2);flex:none}
  .head h1{font-size:22px;color:var(--navy);line-height:1.4}
  .head .count{font-size:14px;color:var(--gold-text);margin-top:2px}

  .card{background:var(--paper);border:1px solid var(--frame);border-radius:18px;box-shadow:var(--shadow);padding:14px 12px 16px;margin-bottom:16px}
  .lead{font-size:15px;color:var(--muted);margin:0 4px 10px}

  /* カレンダー */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
  .cal-nav b{font-size:19px;color:var(--navy)}
  .nav-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--frame);background:#fff;color:var(--gold-text);font-size:20px;cursor:pointer}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .wd{font-size:13px;color:var(--muted);padding:2px 0}
  .wd.sun{color:var(--sun)} .wd.sat{color:var(--sat)}
  .day{position:relative;aspect-ratio:1/1;min-height:42px;border-radius:12px;border:none;background:var(--tint);
       font-size:17px;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .day.off{background:transparent;color:var(--off);cursor:default}
  .day.blank{background:transparent;cursor:default}
  .day.done{background:var(--done)}
  .day.done::after{content:"";position:absolute;bottom:6px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--gold)}
  .day.sel{outline:3px solid var(--gold);outline-offset:-3px;font-weight:700}
  /* 大切な日の印（2026-11-21）。右上の小さな★ */
  .day.sp::before{content:"★";position:absolute;top:2px;right:5px;font-size:11px;line-height:1;color:var(--mark)}
  .legend .sp-l{color:var(--mark)}
  .legend{display:flex;gap:14px;justify-content:flex-end;font-size:13px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:4px;vertical-align:middle}

  /* その日の7つの運 */
  .day-title{font-size:19px;color:var(--navy);font-weight:700;margin:0 4px 4px}
  .note{font-size:14px;color:var(--muted);margin:0 4px 10px}
  /* 運を1つ選ぶ */
  .q{font-size:18px;font-weight:700;color:var(--ink);margin:2px 4px 10px}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;border-radius:14px;border:1.5px solid var(--line);
        background:#fff;padding:8px 12px;text-align:left;cursor:pointer}
  .pick .pn{font-size:17px;font-weight:700;color:var(--ink)}
  .pick .pm{font-size:13px;color:var(--muted)}
  .pick.done{background:var(--cream-tint);border-color:var(--gold)}
  .pick.done .pm{color:var(--gold-text)}
  /* 選んだ運 */
  .back{border:none;background:none;color:var(--gold-text);font-size:15px;cursor:pointer;padding:2px 4px;margin-bottom:6px}
  .rhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 4px}
  .rname{font-size:20px;font-weight:700;color:var(--ink)}
  .rscore{font-size:14px;color:var(--muted);white-space:nowrap}
  .rscore b{font-size:18px;color:var(--navy)}
  .ask{font-size:16px;color:var(--ink);margin:10px 4px 0}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .opt{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:16px;cursor:pointer;padding:4px 2px}
  .opt.on.r1{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opt.on.r0{background:var(--cream-tint);border-color:var(--gold);color:var(--ink);font-weight:700}
  .opt.on.rm1{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
  .opt:disabled{opacity:.6}
  .memo{margin-top:12px}
  .memo label{display:block;font-size:14px;color:var(--muted);margin:0 4px 4px}
  .memo textarea{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:16px;line-height:1.6;resize:vertical;background:#fdfcf9}
  .memo .mrow{margin-top:4px;font-size:13px;color:var(--muted);text-align:right}
  /* 保存は一番下のこのボタン1つだけ（2026-11-25）。評価を選ぶまでは薄く表示して押せない */
  .savebtn{display:block;width:100%;margin-top:14px;min-height:50px;border:none;border-radius:999px;background:var(--btn-gold);color:var(--ink);font-weight:700;font-size:17px;cursor:pointer}
  .savebtn:disabled{opacity:.4;cursor:default}
  .savehint{margin:6px 4px 0;font-size:13px;color:var(--muted);text-align:center}
  /* 保存していない内容があるときの確かめ（2026-11-25） */
  .dlg-bg{position:fixed;inset:0;background:rgba(43,36,24,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
  .dlg{background:var(--paper);border:1px solid var(--frame);border-radius:16px;padding:20px 18px 16px;max-width:340px;width:100%;box-shadow:var(--shadow-strong)}
  .dlg p{font-size:16px;line-height:1.7;margin:0 0 14px;color:var(--ink)}
  .dlg .row{display:flex;gap:8px}
  .dlg button{flex:1;min-height:46px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer}
  .dlg .stay{background:var(--btn-gold);border:none;color:var(--ink)}
  .dlg .leave{background:#fff;border:1.5px solid var(--frame);color:var(--gold-text)}
  .saved{margin:12px 4px 0;font-size:16px;color:var(--good);font-weight:700}
  .more{display:inline-block;margin:6px 4px 0;border:none;background:none;color:var(--gold-text);font-size:14px;cursor:pointer;padding:2px 0;text-decoration:underline}

  .empty{font-size:16px;color:var(--muted);text-align:center;padding:18px 8px}
  .chat{display:block;text-align:center;margin:8px auto 0;max-width:320px;padding:14px;border-radius:999px;background:#06C755;color:#fff;font-weight:700;text-decoration:none;font-size:17px}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
         background:var(--navy);color:#fff;border-radius:14px;padding:12px 18px;font-size:16px;max-width:calc(100% - 32px);
         box-shadow:0 8px 24px rgba(90,70,30,.3);transition:all .3s;pointer-events:none;z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .fatal{text-align:center;padding:40px 8px}
  .fatal h2{color:var(--navy);font-size:21px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="head">
    <img src="/start/img/mirai.png" alt="ミライ">
    <div>
      <h1>運勢の振り返り</h1>
      <div class="count" id="count">読み込んでいます…</div>
    </div>
  </div>

  <div id="main" hidden>
    <div class="card">
      <p class="lead">振り返りたい日を選んでください。印のある日は記録済みです。</p>
      <div class="cal-nav">
        <button class="nav-btn" id="prev" aria-label="前の月">‹</button>
        <b id="ym"></b>
        <button class="nav-btn" id="next" aria-label="次の月">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span id="splegend" class="sp-l" hidden>★ 大切な日</span><span><i></i>記録済み</span></div>
    </div>

    <div class="card" id="daycard" hidden>
      <div class="day-title" id="daytitle"></div>
      <div id="dayview"></div>
    </div>
    <div id="none" class="card empty" hidden>まだ振り返れる日がありません。登録した次の日から振り返れます。</div>
  </div>

  <div id="fatal" class="fatal" hidden>
    <h2 id="ftitle"></h2>
    <p id="ftext"></p>
  </div>

  <a class="chat" id="tochat" href="https://line.me/R/oaMessage/%40768invlu/">トークに戻る</a>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var LIFF_URL = "https://liff.line.me/2010604081-ZArs25u8?review=1";
  var CHAT_URL = "https://line.me/R/oaMessage/%40768invlu/";
  var API = "https://miraisil-webhook.onrender.com";
  var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var qs = new URLSearchParams(location.search);
  if (local && qs.get("api")) API = qs.get("api");
  // 日付つきで開いたとき（?d=YYYY-MM-DD）。LINE ログインへ回すときも日付を持っていく。
  var D0 = /^\d{4}-\d{2}-\d{2}$/.test(qs.get("d") || "") ? qs.get("d") : null;
  if (D0) LIFF_URL += "&d=" + D0;
  var LABEL = { "1": "良かった", "0": "ふつう", "-1": "よくなかった" };
  var CLS = { "1": "r1", "0": "r0", "-1": "rm1" };
  var WD = ["日", "月", "火", "水", "木", "金", "土"];

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function store(k, v){ try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function toast(t){ var x = $("toast"); x.textContent = t; x.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(function(){ x.classList.remove("on"); }, 2600); }
  function fatal(t, s){ $("main").hidden = true; $("fatal").hidden = false; $("ftitle").textContent = t; $("ftext").textContent = s || ""; }
  $("tochat").addEventListener("click", function(ev){
    ev.preventDefault();
    try { if (window.liff && liff.isInClient && liff.isInClient()) { liff.closeWindow(); setTimeout(function(){ location.href = CHAT_URL; }, 800); return; } } catch (e) {}
    location.href = CHAT_URL;
  });

  var S = load("review_s") || (local ? qs.get("s") : null);
  if (!S) {
    // LINE ログインを経ていない（直接開いた・通行証が切れた）。LIFF を通して開き直す。1回だけ。
    var t = +(load("review_redir") || 0);
    if (Date.now() - t > 20000) { store("review_redir", String(Date.now())); location.replace(LIFF_URL); }
    else fatal("LINEとの連携ができませんでした。", "LINEのトークから、もう一度開いてください。");
    return;
  }

  function api(path, body){
    body = body || {}; body.s = S;
    return fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function(r){
        if (r.status === 401) { store("review_s", null); location.replace(LIFF_URL); throw new Error("login"); }
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      });
  }

  var M = null, selDate = null;

  function setCount(c){
    if (!c) return;
    $("count").textContent = c.records ? ("記録 " + c.records + "回・" + c.days + "日") : "まだ記録はありません";
  }
  function ymAdd(ym, n){
    var p = ym.split("-"), y = +p[0], m = +p[1] - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + "-" + (m < 9 ? "0" : "") + (m + 1);
  }
  function iso(y, m, d){ return y + "-" + (m < 10 ? "0" : "") + m + "-" + (d < 10 ? "0" : "") + d; }

  function drawMonth(){
    var p = M.month.split("-"), y = +p[0], m = +p[1];
    $("ym").textContent = y + "年" + m + "月";
    $("prev").disabled = !M.start || M.month <= M.start.slice(0, 7);
    $("next").disabled = !M.end || M.month >= M.end.slice(0, 7);
    var g = $("grid"); g.innerHTML = "";
    WD.forEach(function(w, i){ g.appendChild(el("div", "wd" + (i === 0 ? " sun" : i === 6 ? " sat" : ""), w)); });
    var first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    for (var i = 0; i < first; i++) g.appendChild(el("div", "day blank"));
    $("splegend").hidden = !Object.keys(M.special || {}).length;
    for (var d = 1; d <= days; d++) {
      var key = iso(y, m, d), ok = key >= M.start && key <= M.end;
      var sp = (M.special || {})[key];
      var b = el("button", "day" + (ok ? "" : " off") + (M.recorded[key] ? " done" : "") + (sp ? " sp" : "") + (key === selDate ? " sel" : ""), String(d));
      b.type = "button";
      if (sp) b.title = sp.join("・");
      var spl = sp ? ("・大切な日：" + sp.join("・")) : "";
      if (ok) { b.dataset.d = key; b.setAttribute("aria-label", m + "月" + d + "日" + (M.recorded[key] ? "（記録済み）" : "") + spl); b.addEventListener("click", function(){ openDay(this.dataset.d); }); }
      else { b.disabled = true; if (sp) b.setAttribute("aria-label", m + "月" + d + "日" + spl); }
      g.appendChild(b);
    }
  }

  function loadMonth(ym){
    return api("/review/api/month", { month: ym || "" }).then(function(j){
      M = j; setCount(j.counts);
      if (!j.start) { $("main").hidden = false; $("none").hidden = false; $("prev").disabled = $("next").disabled = true; $("ym").textContent = ""; return; }
      $("main").hidden = false; drawMonth();
    });
  }

  // 日付を選ぶ → 「何の運について振り返りますか？」で1つ選ぶ → その運だけを出す（2026-11-19 てつさん指示）
  var DAY = null;
  // 選んだ評価・ひとことを保存していないとき、別の日や別の運へ移る前に確かめる（2026-11-25）
  var DIRTY = function(){ return false; };
  function confirmLeave(go){
    if (!DIRTY()) { go(); return; }
    var bg = el("div", "dlg-bg"), box = el("div", "dlg"), row = el("div", "row");
    box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true");
    box.appendChild(el("p", null, "選んだ内容はまだ保存していません。移ると、選んだ内容は消えます。よろしいですか？"));
    var stay = el("button", "stay", "戻って保存する"), leave = el("button", "leave", "消して移る");
    stay.type = leave.type = "button";
    stay.addEventListener("click", function(){ document.body.removeChild(bg); });
    leave.addEventListener("click", function(){ document.body.removeChild(bg); DIRTY = function(){ return false; }; go(); });
    row.appendChild(leave); row.appendChild(stay); box.appendChild(row); bg.appendChild(box);
    document.body.appendChild(bg); stay.focus();
  }

  function openDay(d, cat){
    if (DIRTY() && d !== selDate) { confirmLeave(function(){ openDay(d, cat); }); return; }
    DIRTY = function(){ return false; };
    selDate = d; drawMonth();
    $("daycard").hidden = false; $("dayview").innerHTML = ""; $("daytitle").textContent = "読み込んでいます…";
    api("/review/api/day", { date: d }).then(function(j){
      if (selDate !== d) return;
      DAY = j; $("daytitle").textContent = j.label;
      var c = cat && j.categories.filter(function(x){ return x.key === cat; })[0];
      if (c) showCat(c); else showPicker();
      $("daycard").scrollIntoView({ behavior: "smooth", block: "start" });
    }).catch(function(){ $("daytitle").textContent = "読み込めませんでした。もう一度日付を選んでください。"; });
  }

  function showPicker(){
    DIRTY = function(){ return false; };
    var v = $("dayview"); v.innerHTML = "";
    v.appendChild(el("p", "q", "何の運について振り返りますか？"));
    var g = el("div", "picks");
    DAY.categories.forEach(function(c){
      var b = el("button", "pick" + (c.rating != null ? " done" : ""));
      b.type = "button";
      b.appendChild(el("span", "pn", c.emoji + " " + c.label));
      b.appendChild(el("span", "pm", c.rating != null ? ("✓ 記録済み（" + LABEL[c.rating] + "）") : (c.score != null ? ("予報 " + c.score + "点") : "")));
      b.addEventListener("click", function(){ showCat(c); });
      g.appendChild(b);
    });
    v.appendChild(g);
  }

  function showCat(c){
    var v = $("dayview"); v.innerHTML = "";
    var back = el("button", "back", "‹ 運を選びなおす"); back.type = "button";
    back.addEventListener("click", function(){ confirmLeave(showPicker); }); v.appendChild(back);
    var h = el("div", "rhead");
    h.appendChild(el("div", "rname", c.emoji + " " + c.label));
    var sc = el("div", "rscore");
    if (c.score != null) { sc.appendChild(document.createTextNode("予報 ")); sc.appendChild(el("b", null, String(c.score))); sc.appendChild(document.createTextNode("点")); }
    h.appendChild(sc); v.appendChild(h);
    var note = DAY.source === "computed" ? "この日は配信の記録が無いため、生年月日から計算した予報の点数です。" : "";
    v.appendChild(el("p", "ask", "この日の" + c.label + "は、どうでしたか？" + (note ? "（" + note + "）" : "")));

    // 3つのボタンは「選ぶ」だけ。保存は一番下の［保存する］で、評価とひとことを一緒に（2026-11-25 てつさん指示）
    var pick = c.rating != null ? c.rating : null;
    var opts = el("div", "opts"), btns = {};
    [-1, 0, 1].forEach(function(r){   // 左から よくなかった・ふつう・良かった
      var b = el("button", "opt " + CLS[r], LABEL[r]);
      b.type = "button";
      b.addEventListener("click", function(){ pick = r; refresh(); });
      btns[r] = b; opts.appendChild(b);
    });
    v.appendChild(opts);

    var memo = el("div", "memo"), lab = el("label", null, "ひとこと（任意）"), ta = el("textarea"), mrow = el("div", "mrow");
    ta.maxLength = 200; ta.value = c.comment || ""; ta.id = "memo"; lab.htmlFor = "memo";
    memo.appendChild(lab); memo.appendChild(ta); memo.appendChild(mrow); v.appendChild(memo);
    ta.addEventListener("input", refresh);

    var sb = el("button", "savebtn"), hint = el("p", "savehint");
    sb.type = "button"; v.appendChild(sb); v.appendChild(hint);
    var done = el("div"); v.appendChild(done);

    function changed(){ return pick !== (c.rating != null ? c.rating : null) || ta.value.trim() !== (c.comment || ""); }
    DIRTY = changed;   // 評価かひとことを、保存した内容から変えたとき
    var busy = false;
    function refresh(){
      Object.keys(btns).forEach(function(k){ var on = pick != null && +k === pick; btns[k].classList.toggle("on", on); btns[k].setAttribute("aria-pressed", on ? "true" : "false"); });
      mrow.textContent = ta.value.length + "/200字";
      sb.textContent = c.rating != null ? "保存し直す" : "保存する";
      sb.disabled = busy || pick == null || !changed();
      hint.textContent = pick == null ? "上の3つから選ぶと、保存できます" : "";
      if (changed()) done.innerHTML = "";
    }
    refresh();

    sb.addEventListener("click", function(){
      if (busy || pick == null) return; busy = true; refresh();
      var r = pick, text = ta.value;
      api("/review/api/save", { date: selDate, category: c.key, rating: r, comment: text }).then(function(j){
        c.rating = r; c.comment = text.trim(); ta.value = c.comment;
        setCount(j.counts);
        if (!j.overwritten) { M.recorded[selDate] = (M.recorded[selDate] || 0) + 1; drawMonth(); }
        busy = false; refresh();
        done.innerHTML = "";
        done.appendChild(el("p", "saved", j.overwritten ? "書き直しました。" : ("記録しました。記録は" + j.counts.records + "回目です。")));
        var more = el("button", "more", "ほかの運も振り返る"); more.type = "button";
        more.addEventListener("click", showPicker); done.appendChild(more);
      }).catch(function(e){ busy = false; refresh(); if (String(e.message) !== "login") toast("保存できませんでした。もう一度お試しください。"); });
    });
  }

  $("prev").addEventListener("click", function(){ loadMonth(ymAdd(M.month, -1)); });
  $("next").addEventListener("click", function(){ loadMonth(ymAdd(M.month, 1)); });
  // 朝のカードなどから日付つきで開いたとき（/review/?d=YYYY-MM-DD）は、その日を選んだ状態で始める
  loadMonth(D0 ? D0.slice(0, 7) : "").then(function(){
    if (D0 && M && M.start && D0 >= M.start && D0 <= M.end) openDay(D0);
  }).catch(function(e){ if (String(e.message) !== "login") fatal("ひらけませんでした。", "少し待ってから、もう一度お試しください。"); });
})();
</script>
