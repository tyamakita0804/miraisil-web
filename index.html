<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>miraisil | 天体と、毎日を。</title>
  <meta name="description" content="miraisilは、天体データをもとにした12星座のデイリー運勢をInstagram Storiesで毎日配信します。">
  <style>
    :root {
      --ink:    #1a1a2e;
      --mid:    #4a4a6a;
      --pale:   #8888aa;
      --bg:     #f9f8fc;
      --surface:#ffffff;
      --accent: #7c6af7;
      --rule:   #e4e2f0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.8;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      padding: 20px 32px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-decoration: none;
    }
    .logo span { color: var(--accent); }

    .hero {
      max-width: 680px;
      margin: 80px auto 60px;
      padding: 0 24px;
      text-align: center;
    }
    .hero-label {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
    }
    .hero p {
      color: var(--mid);
      font-size: 15px;
      max-width: 480px;
      margin: 0 auto 36px;
    }
    .hero-cta {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 14px 32px;
      border-radius: 6px;
      text-decoration: none;
    }
    .hero-cta:hover { opacity: 0.88; }

    footer {
      text-align: center;
      padding: 40px 24px;
      font-size: 12px;
      color: var(--pale);
      border-top: 1px solid var(--rule);
      margin-top: 80px;
    }
    footer a { color: var(--pale); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <a class="logo" href="/">mirai<span>sil</span></a>
</header>

<div class="hero">
  <p class="hero-label">Daily Horoscope by Astro Data</p>
  <h1>天体と、<br>毎日を。</h1>
  <p>miraisilは、スイス天文暦データをもとにした12星座のデイリー運勢をInstagram Storiesで毎日配信するサービスです。</p>
  <a class="hero-cta" href="https://www.instagram.com/" target="_blank" rel="noopener">Instagramで見る</a>
</div>

<footer>
  <p>&copy; 2026 miraisil　―　<a href="/privacy-policy.html">プライバシーポリシー</a></p>
</footer>

</body>
</html>
