<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>決済ページへ移動中... | miraisil</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --ink:    #1a1a2e;
      --mid:    #4a4a6a;
      --pale:   #8888aa;
      --bg:     #f9f8fc;
      --surface:#ffffff;
      --accent: #7c6af7;
      --rule:   #e4e2f0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--rule);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--ink);
    }
    .sub {
      font-size: 14px;
      color: var(--pale);
      line-height: 1.7;
    }
    .error-icon { font-size: 40px; margin-bottom: 16px; }
    .btn-line {
      display: inline-block;
      margin-top: 24px;
      padding: 13px 28px;
      background: #06C755;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
    }
    .btn-line:hover { opacity: 0.88; }
    .btn-retry {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 24px;
      background: transparent;
      color: var(--accent);
      font-size: 14px;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- ローディング表示 -->
  <div id="state-loading">
    <div class="spinner"></div>
    <h2>決済ページへ移動しています...</h2>
    <p class="sub">しばらくお待ちください</p>
  </div>

  <!-- エラー表示 -->
  <div id="state-error" style="display:none;">
    <p class="error-icon">⚠️</p>
    <h2>エラーが発生しました</h2>
    <p class="sub" id="error-detail">LINEとの連携に失敗しました。</p>
    <a class="btn-line" href="https://line.me/R/ti/p/@768invlu">
      LINEで登録する
    </a><br>
    <a class="btn-retry" onclick="location.reload()">再試行する</a>
  </div>
</div>

<!-- miraisil.jp/start からの LINE ログイン（2026-10-12）。?start=<token> のときだけ使う。
     LIFF のエンドポイントがこのページなので、ログイン後の処理をここで行う。 -->
<div id="start-box" style="display:none;position:fixed;inset:0;background:#fbf8f1;color:#34374d;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;overflow:auto;padding:28px 16px;font-size:19px;line-height:1.75;z-index:10">
  <div style="max-width:480px;margin:0 auto;text-align:center">
    <img src="/start/img/mirai.png" alt="ミライ" width="110" height="110" style="border-radius:50%;box-shadow:0 4px 18px rgba(27,37,80,.25)">
    <h2 id="start-title" style="color:#2f3768;font-size:24px;line-height:1.5;margin:16px 0 10px">LINEと連携しています…</h2>
    <p id="start-text" style="margin-bottom:8px"></p>
    <div id="start-actions"></div>
  </div>
</div>

<script>
  var LIFF_ID = "2010604081-ZArs25u8";
  var CHECKOUT_BASE = "https://miraisil-webhook.onrender.com/checkout/";

  function showError(msg) {
    document.getElementById("state-loading").style.display = "none";
    if (msg) document.getElementById("error-detail").textContent = msg;
    document.getElementById("state-error").style.display = "block";
  }

  // liff.init()後に呼ぶ: location.search → liff.state の順で plan を取得
  // LINE内ブラウザでは ?liff.state=%3Fplan%3Dlight の形で渡されるため両方チェックが必要
  function getPlan() {
    var p = new URLSearchParams(location.search).get("plan");
    if (!p && liff.state) {
      p = new URLSearchParams(liff.state).get("plan");
    }
    return p;
  }

  // ── miraisil.jp/start からの登録（2026-10-12）────────────────────────
  var START_API = "https://miraisil-webhook.onrender.com/start/api/link";
  var CHAT_URL = "https://line.me/R/oaMessage/%40768invlu/";
  var FRIEND_URL = "https://lin.ee/WA0V5f4";
  function getParam(name) {
    var p = new URLSearchParams(location.search).get(name);
    if (!p && window.liff && liff.state) p = new URLSearchParams(liff.state).get(name);
    return p;
  }
  function startView(title, text, actions) {
    document.getElementById("start-box").style.display = "block";
    document.getElementById("start-title").textContent = title;
    document.getElementById("start-text").textContent = text || "";
    var box = document.getElementById("start-actions"); box.innerHTML = "";
    (actions || []).forEach(function(a) {
      var el = document.createElement("a");
      el.href = a.href; el.textContent = a.label;
      el.style.cssText = "display:block;margin-top:14px;padding:16px;border-radius:999px;font-weight:700;font-size:19px;text-decoration:none;text-align:center;" +
        (a.kind === "line" ? "background:#06C755;color:#fff;box-shadow:0 8px 20px rgba(6,199,85,.25)" : a.kind === "gold" ? "background:linear-gradient(120deg,#3f4a8f,#5662a8);color:#fff" : "background:#fff;border:2px solid #c3c6db;color:#3f4a8f");
      if (a.note) { var n = document.createElement("p"); n.textContent = a.note; n.style.cssText = "font-size:14px;color:#666a80;margin:8px 4px 0;line-height:1.7"; box.appendChild(el); box.appendChild(n); return; }
      box.appendChild(el);
    });
  }
  function handleStart(token) {
    startView("LINEと連携しています…", "");
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    var at = liff.getAccessToken();
    fetch(START_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, access_token: at }) })
      .then(function(r) { return r.json(); })
      .then(function(j) {
        var nn = j.nickname ? j.nickname + "さん、" : "";
        var toChat = { href: CHAT_URL, label: "LINEのトークを開く", kind: "line" };
        // S16「今すぐPremiumを始める」から来た人：登録のあと Stripe の申し込みへ（2026-10-13）
        var toPay = j.go_checkout && j.checkout_url ? { href: j.checkout_url, label: "Premiumのお申し込みへ進む", kind: "line",
          note: "月額330円（税込）。お申し込みの時点で初回のご請求となり、以後毎月自動で更新されます。解約は LINE で「解約」と送るだけです。" } : null;
        if (toPay && (j.status === "created" || j.status === "completed" || j.status === "test")) {
          var head = j.status === "test" ? "【テスト】" : "";
          if (j.needs_friend) {
            startView("あと少しです", nn + "登録ができました。ミライを友だち追加してから、Premiumのお申し込みへお進みください。", [{ href: FRIEND_URL, label: "友だち追加する", kind: "line" }, { href: toPay.href, label: toPay.label, kind: "ghost", note: toPay.note }]);
            return;
          }
          startView(head + "登録が完了しました", nn + "続けて、Premiumのお申し込み画面に進みます。", [toPay, toChat]);
          setTimeout(function() { location.href = toPay.href; }, 1800);
          return;
        }
        if (j.status === "created" || j.status === "completed") {
          if (j.needs_friend) {
            startView("あと少しです", nn + "登録ができました。最後に、ミライを友だち追加してください。友だち追加すると、今日の運勢が届きます。", [{ href: FRIEND_URL, label: "友だち追加する", kind: "line" }]);
            return;
          }
          startView("登録が完了しました", nn + "LINEのトークに、今日の運勢をお送りしました。今日から14日間、Premiumを無料でお使いいただけます。", [toChat]);
          if (liff.isInClient()) setTimeout(function() { location.href = CHAT_URL; }, 2500);
        } else if (j.status === "existing") {
          var acts = [toChat];
          if (j.checkout_url) acts.push({ href: j.checkout_url, label: "Premiumを申し込む（月額330円）", kind: "ghost", note: "お申し込みの時点で月額330円（税込）をご請求し、以後は毎月自動更新されます。解約はいつでもLINEで「解約」と送ってください。" });
          startView("すでにご登録いただいています", nn + "登録内容はそのままです。LINEのトークからご利用ください。", acts);
        } else if (j.status === "test") {
          startView("【テスト】送りました", "あなたのLINEに、登録直後に届くメッセージ（あいさつ → 今日の運勢）を送りました。本当の登録内容・課金状態は変えていません。", [toChat]);
        } else if (j.status === "test_forbidden") {
          startView("テスト用の入口です", "この入口は運営のテスト用のため、ご利用いただけません。", [{ href: "https://miraisil.jp/start/", label: "はじめからやり直す", kind: "ghost" }]);
        } else if (j.status === "expired" || j.status === "not_found" || j.status === "used") {
          startView("もう一度お試しください", j.status === "used" ? "この登録は、すでに別のLINEアカウントで使われています。" : "登録の有効期限（24時間）が過ぎたか、見つかりませんでした。", [{ href: "https://miraisil.jp/start/", label: "はじめからやり直す", kind: "ghost" }]);
        } else {
          startView("うまく連携できませんでした", "少し待ってから、もう一度お試しください。", [{ href: location.href, label: "もう一度試す", kind: "ghost" }]);
        }
      })
      .catch(function() {
        startView("うまく連携できませんでした", "通信の状態を確かめて、もう一度お試しください。", [{ href: location.href, label: "もう一度試す", kind: "ghost" }]);
      });
  }
  // ── 個人鑑定の面談カード（2026-10-18）────────────────────────
  // ?kantei=1 のとき、LINE ログインのあとアクセストークンを検証してもらい、
  // 画面用の短命の通行証を受け取って /kantei/ を開く（通行証は URL に載せず、このタブの sessionStorage に置く）。
  var KANTEI_LOGIN_API = "https://miraisil-webhook.onrender.com/kantei/api/login";
  function handleKantei() {
    startView("個人鑑定の画面をひらいています…", "");
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    fetch(KANTEI_LOGIN_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ access_token: liff.getAccessToken() }) })
      .then(function(r) { if (!r.ok) throw new Error("login " + r.status); return r.json(); })
      .then(function(j) {
        try { sessionStorage.setItem("kantei_s", j.s); sessionStorage.removeItem("kantei_redir"); } catch (e) {}
        location.replace("/kantei/");
      })
      .catch(function() {
        startView("うまくひらけませんでした", "少し待ってから、もう一度お試しください。トークで「面談を再開」と送ると、トークで続けることもできます。", [{ href: location.href, label: "もう一度試す", kind: "ghost" }, { href: CHAT_URL, label: "LINEのトークに戻る", kind: "line" }]);
      });
  }

  var _early = new URLSearchParams(location.search);
  if (_early.get("start") || (_early.get("liff.state") || "").indexOf("start=") >= 0
      || _early.get("kantei") || (_early.get("liff.state") || "").indexOf("kantei=") >= 0) {
    document.getElementById("start-box").style.display = "block";
  }

  liff.init({ liffId: LIFF_ID })
    .then(function() {
      if (getParam("kantei")) { handleKantei(); return; }
      var startToken = getParam("start");
      if (startToken) { handleStart(startToken); return; }
      var plan = getPlan();
      if (!plan || (plan !== "light" && plan !== "premium")) {
        showError("プランが指定されていません。プランページに戻ってやり直してください。");
        return;
      }
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
      return liff.getProfile().then(function(profile) {
        location.href = CHECKOUT_BASE + plan + "?uid=" + encodeURIComponent(profile.userId);
      });
    })
    .catch(function(err) {
      console.error("[LIFF] init/getProfile error:", err);
      if (document.getElementById("start-box").style.display === "block") {
        startView("うまく連携できませんでした", "LINEとの連携に失敗しました。もう一度お試しいただくか、質問ページに表示された登録コードをお使いください。", [{ href: location.href, label: "もう一度試す", kind: "ghost" }]);
        return;
      }
      showError("LINEとの連携に失敗しました。もう一度お試しください。");
    });
</script>
</body>
</html>
